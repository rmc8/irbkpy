name: Release to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/irbkpy
    permissions:
      id-token: write  # Mandatory for Trusted Publishing (OIDC)
      contents: write  # Required for creating git tags and GitHub releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and determine release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # mainブランチへのpush時以外（手動実行、タグプッシュ、Release作成）は常に公開
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # mainブランチへのpush時: すでにタグが存在するか確認
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Skipping duplicate release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$VERSION detected on main. Publishing release."
            echo "skip=false" >> "$GITHUB_OUTPUT"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION" || true
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes || true
          fi

      - name: Install uv
        if: steps.check.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        run: uv python install

      - name: Build package distributions
        if: steps.check.outputs.skip != 'true'
        run: uv build

      - name: Publish distribution 📦 to PyPI
        if: steps.check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
